name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Keep internal tags, unpublished-document references, field-application
  # names and tooling traces out of the public tree (and PR commit messages).
  public-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked files
        if: github.event_name != 'pull_request'
        run: .github/scripts/check-public-terms.sh
      - name: Check tracked files and PR commit messages
        if: github.event_name == 'pull_request'
        run: .github/scripts/check-public-terms.sh "origin/${{ github.base_ref }}..HEAD"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # weasyprint (report backend) needs system pango/cairo at runtime
      - name: System deps for report rendering
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0
      # The same entry point contributors use, so run.sh cannot rot unnoticed.
      - name: Set up ddoc + light plugins (./run.sh setup)
        run: ./run.sh setup
      - name: Core test set (./run.sh test)
        run: ./run.sh test
      - name: Demo (./run.sh demo)
        run: ./run.sh demo

  # Dogfood: ddoc diff as a data gate in our own CI.
  # exit code carries the verdict — 0 OK / 1 DRIFT / 2 BLIND.
  drift-gate-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -e packages/ddoc
      - name: Zoo regime_shift must gate (expect DRIFT → exit 1)
        working-directory: packages/ddoc/zoo/regime_shift
        run: |
          python make.py
          if ddoc diff data/ref.csv data/cur.csv; then
            echo "::error::expected DRIFT (exit 1) but got OK"; exit 1
          else
            code=$?
            [ "$code" -eq 1 ] || { echo "::error::expected exit 1, got $code"; exit 1; }
          fi
      - name: Zoo rhythm_not_drift must pass (expect OK → exit 0)
        working-directory: packages/ddoc/zoo/rhythm_not_drift
        run: |
          python make.py
          ddoc diff data/ref.csv data/cur.csv
