# A guided tour on real images: frames from a dashcam drive.
#
#   ddoc examples tour dashcam              # narrated, in ./ddoc-tour-dashcam
#
# Needs the vision plugin (and torch). The same file runs on your own two
# folders of images, without the example stories:
#
#   ddoc examples tour dashcam --save check.yaml
#   ddoc recipe run check.yaml --narrate --var example= --var ref=old_frames --var cur=new_frames
name: tour-dashcam
description: Frames of a real dashcam drive through probe and diff with the embedding map
workspace: .ddoc-recipe-out
required_plugins: [ddoc_vision]

tour:
  title:
    en: A dashcam drive, frame by frame
    ko: 블랙박스 주행, 프레임으로
  about:
    en: >-
      Frames from 12 minutes of a real two-camera dashcam. Video is compared as images sampled
      every few seconds. Another camera, the next stretch of road, the noise level of the same
      stretch, and a smudged lens planted on real frames.
    ko: >-
      실제 2채널 블랙박스 12분 주행의 프레임. 동영상은 몇 초마다 뽑은 이미지로 비교합니다. 다른 카메라,
      다음 구간의 도로, 같은 구간의 잡음 수준, 실제 프레임에 심은 렌즈 흐림까지.
  needs:
    en: the vision plugin and torch (./run.sh setup vision)
    ko: vision 플러그인과 torch (./run.sh setup vision)
  own: --var example= --var ref=<baseline folder> --var cur=<current folder>

vars:
  example: drive          # empty = use your own ref and cur folders
  ref: swap/ref
  cur: swap/cur
  lang: ""                # empty: each command follows $DDOC_LANG

steps:
  - id: get
    title:
      en: From video to frames
      ko: 동영상에서 프레임으로
    note:
      en: >-
        ddoc compares images, not video: sample a frame every few seconds and compare two folders.
        For your own video, `ffmpeg -i drive.mp4 -vf fps=1/3,scale=320:-1 frames/%04d.jpg` does it.
        These frames come from a real drive, cut above the dashboard and shrunk. The first story:
        the front camera (baseline) against the rear one at the same moments (current), as if the
        wrong camera's footage arrived.
      ko: >-
        ddoc 은 동영상이 아니라 이미지를 비교합니다. 몇 초마다 프레임을 뽑아 폴더 둘로 비교합니다. 내 영상이라면
        `ffmpeg -i drive.mp4 -vf fps=1/3,scale=320:-1 frames/%04d.jpg` 로 뽑습니다. 이 프레임은 실제 주행에서
        대시보드 위만 잘라 줄인 것입니다. 첫 이야기는 같은 순간의 전방 카메라(기준)와 후방 카메라(현재),
        다른 카메라의 영상이 잘못 들어온 상황입니다.
    when: '${vars.example} != ""'
    run: examples.generate
    with:
      modality: dashcam
      out: swap
      scenario: camera-swap

  - id: look
    title:
      en: Look before judging
      ko: 판정 전에 미리 보기
    note:
      en: >-
        Two folders of images go to the vision plugin. Without it diff would come back BLIND, and
        probe says so here, before anything runs.
      ko: >-
        이미지 폴더 둘은 vision 플러그인이 판정합니다. 플러그인이 없으면 diff 는 BLIND 가 되는데, probe 가
        실행 전에 여기서 알려 줍니다.
    run: probe
    with:
      ref: ${vars.ref}
      cur: ${vars.cur}
      lang: ${vars.lang}

  - id: judge
    title:
      en: Judge, with the embedding map
      ko: 판정하고 임베딩 지도 보기
    note:
      en: >-
        Two kinds of evidence: measured image properties (exposure, colour, sharpness, noise, ...)
        and an embedding map, where each image is a point placed by what it shows. Here the two
        cameras' frames sit apart on the map. Under the map, note.html names files to open:
        a typical frame of each side and the current frames least like the baseline.
      ko: >-
        근거는 두 가지입니다. 이미지에서 잰 속성(노출, 색, 선명도, 잡음 등)과, 이미지가 담은 내용에 따라
        점을 찍은 임베딩 지도. 여기서는 두 카메라의 프레임이 지도에서 갈라집니다. note.html 의 지도 아래에
        열어 볼 파일(각 쪽의 대표 프레임, 기준과 가장 다른 현재 프레임)이 나옵니다.
    run: diff
    with:
      ref: ${vars.ref}
      cur: ${vars.cur}
      with_embeddings: true
      report: note.html
      lang: ${vars.lang}

  - id: get-next
    title:
      en: "Next: the same camera, the next stretch"
      ko: "다음: 같은 카메라, 다음 구간"
    note:
      en: The front camera again, the first six minutes of the drive against the next six.
      ko: 다시 전방 카메라. 주행의 앞 6분과 뒤 6분입니다.
    when: '${vars.example} != ""'
    run: examples.generate
    with:
      modality: dashcam
      out: next
      scenario: next-stretch

  - id: judge-next
    title:
      en: Nothing broke, and still DRIFT
      ko: 고장은 없는데도 DRIFT
    note:
      en: >-
        Same camera, but the road changed: expressway and sky in the first half, more city streets
        in the second. That is drift too, of scenery rather than of the camera. A baseline has to
        cover the conditions the data will meet (roads, time of day, weather).
      ko: >-
        카메라는 같지만 도로가 바뀌었습니다. 앞쪽은 고가도로와 하늘, 뒤쪽은 시내 도로가 많습니다. 이것도
        드리프트입니다. 카메라가 아니라 풍경이 바뀐 것입니다. 기준 데이터는 앞으로 만날 조건(도로, 시간대,
        날씨)을 덮어야 합니다.
    when: '${vars.example} != ""'
    run: diff
    with:
      ref: next/ref
      cur: next/cur
      with_embeddings: true
      report: next.html
      lang: ${vars.lang}

  - id: get-same
    title:
      en: "The noise level: the same stretch"
      ko: "잡음 수준: 같은 구간"
    note:
      en: >-
        The first six minutes again, the frames taken three seconds after the baseline's. Nothing
        changed, so whatever score comes out is noise.
      ko: >-
        다시 앞 6분, 이번에는 기준 프레임의 3초 뒤 프레임들입니다. 바뀐 것이 없으니 나오는 점수는 잡음입니다.
    when: '${vars.example} != ""'
    run: examples.generate
    with:
      modality: dashcam
      out: same
      scenario: same-stretch

  - id: judge-same
    title:
      en: What nothing looks like
      ko: 아무 일도 없을 때의 점수
    note:
      en: >-
        Nothing changed, and the verdict says so: OK, every score 0. Each measure is first tested
        against sampling noise; a difference that 60 frames a side could show by chance scores 0,
        so small samples do not raise alarms. A real fault stands out, as the next step shows.
      ko: >-
        바뀐 것이 없고, 판정도 그렇게 말합니다: OK, 모든 점수 0. 속성마다 먼저 표본 잡음과 견줘, 쪽마다
        60장으로 우연히 생길 수 있는 차이는 0점입니다. 그래서 표본이 적어도 잡음에 경보가 울리지 않습니다.
        진짜 고장은 분명히 드러납니다. 다음 단계가 그 예입니다.
    when: '${vars.example} != ""'
    run: diff
    with:
      ref: same/ref
      cur: same/cur
      report: same.html
      lang: ${vars.lang}

  - id: get-blur
    title:
      en: "A planted fault: a smudged lens"
      ko: "심은 고장: 렌즈 흐림"
    note:
      en: >-
        The same in-between frames, blurred as by a smudged or fogged lens. The answer is known:
        sharpness dropped and nothing else changed.
      ko: >-
        같은 사이 프레임을 렌즈에 얼룩이나 김이 서린 것처럼 흐리게 했습니다. 정답을 압니다: 선명도만 떨어지고
        나머지는 그대로입니다.
    when: '${vars.example} != ""'
    run: examples.generate
    with:
      modality: dashcam
      out: blur
      scenario: blurry-lens

  - id: judge-blur
    title:
      en: A fault stands far above the noise
      ko: 고장은 잡음보다 훨씬 크게 드러납니다
    note:
      en: >-
        Against the 0 above: sharpness, noise and dynamic range score close to 1, the most a score
        can be, and sharpness reads as a shift with a narrower spread. blur.html graphs each one.
      ko: >-
        위의 0 과 견줘 보세요. 선명도, 잡음, 명암 범위가 점수의 최대인 1 에 가깝고, 선명도는 이동·수축형으로
        읽힙니다. blur.html 에 값마다 그래프가 있습니다.
    when: '${vars.example} != ""'
    run: diff
    with:
      ref: blur/ref
      cur: blur/cur
      report: blur.html
      lang: ${vars.lang}
