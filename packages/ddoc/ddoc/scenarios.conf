# scenarios.conf — what to run, by situation
#
# Read by `ddoc scenarios` (list · cheat sheet · run · menu), `./run.sh menu`,
# the "Scenarios" tab of `ddoc serve` and docs/cheatsheet.md. Edit here, then
# `./run.sh docs build` to refresh the cheat sheet.
#
#   [id]                      one scenario; `ddoc scenarios run <id>` (lowercase, digits, -)
#   group / group.ko          scenarios with the same group are shown together
#   title / title.ko          what it does
#   when / when.ko            when to use it, one line
#   run                       arguments after `ddoc`. Several lines run in order; every line
#                             but the last must succeed. {name} is replaced by a param value,
#                             always as one argument. [--opt {name}] drops the whole bracket
#                             when the value is empty.
#   param                     name | default | description | description in Korean
#                             (no default and not inside [...] = required)
#   gui                       a tab of `ddoc serve` that can run it (diff, eda, report);
#                             params with the same names fill the form
#   tip / tip.ko              what to know after running it (repeatable)

# ── Getting started ─────────────────────────────────────────────────────────

[check-env]
group    = Getting started
group.ko = 처음 해보기
title    = Check the environment
title.ko = 환경 점검
when     = Before anything else, or when data comes back BLIND unexpectedly
when.ko  = 처음 시작할 때, 또는 예상과 달리 BLIND 가 나올 때
run      = doctor
tip      = A plugin marked ✕ is installed but does not load: its data would come back BLIND
tip.ko   = ✕ 표시 플러그인은 설치는 되어 있지만 불러지지 않습니다 — 그 데이터는 BLIND 가 됩니다

[tour]
group    = Getting started
group.ko = 처음 해보기
title    = Take a guided tour
title.ko = 투어로 한 번에 보기
when     = The whole pipeline on real data, step by step: why, the command and its output
when.ko  = 실제 데이터로 파이프라인 전체를 한 단계씩: 왜 하는지, 명령, 그 출력
param    = name | weather | tour; `ddoc examples tour` lists them | 투어 이름 — `ddoc examples tour` 가 목록
run      = examples tour {name}
tip      = The files land in ./ddoc-tour-{name}; --pause waits for Enter before each step
tip.ko   = 파일은 ./ddoc-tour-{name} 에 남습니다. --pause 는 단계마다 Enter 를 기다립니다
tip      = A tour is one recipe: --save my.yaml, then ddoc recipe run my.yaml --narrate on your own data
tip.ko   = 투어는 레시피 한 장입니다: --save my.yaml 로 꺼내 ddoc recipe run my.yaml --narrate 로 내 데이터에

[try-demo]
group    = Getting started
group.ko = 처음 해보기
title    = Try it on toy data
title.ko = 예제 데이터로 해보기
when     = The first time: generate a pair that drifted, judge it and open the report
when.ko  = 처음 한 번: 드리프트가 있는 예제 쌍을 만들어 판정하고 진단서를 엽니다
param    = dir | ddoc-try | output folder | 출력 폴더
run      = examples generate categorical --out {dir} --scenario shifted
run      = diff {dir}/ref {dir}/cur --report {dir}/note.html
tip      = Open {dir}/note.html in a browser; exit code 1 means DRIFT
tip.ko   = 브라우저로 {dir}/note.html 을 여세요. 종료 코드 1 이 DRIFT 입니다
tip      = Needs the categorical plugin (./run.sh setup installs it)
tip.ko   = categorical 플러그인이 필요합니다 (./run.sh setup 이 설치)

# ── Compare two datasets ────────────────────────────────────────────────────

[look-first]
group    = Compare two datasets
group.ko = 두 데이터 비교
title    = Look before judging
title.ko = 판정 전에 미리 보기
when     = Check what diff would make of two paths: kind of data, who judges, BLIND or not
when.ko  = diff 가 두 경로를 어떻게 다룰지 확인: 데이터 종류, 판정 주체, BLIND 여부
param    = ref | | baseline (file or folder) | 기준 데이터 (파일 또는 폴더)
param    = cur | | current (file or folder) | 현재 데이터 (파일 또는 폴더)
run      = probe {ref} {cur}
tip      = For two CSVs it also lists the columns that would be compared and the one-sided ones
tip.ko   = CSV 두 개면 비교할 열과 한쪽에만 있는 열도 보여줍니다

[compare]
group    = Compare two datasets
group.ko = 두 데이터 비교
title    = Judge with a diagnostic report
title.ko = 판정하고 진단서 만들기
when     = The everyday case: verdict plus a report that explains it
when.ko  = 가장 흔한 경우: 판정과 그 근거를 담은 진단서
param    = ref | | baseline (file or folder) | 기준 데이터 (파일 또는 폴더)
param    = cur | | current (file or folder) | 현재 데이터 (파일 또는 폴더)
param    = report | note.html | report path (.html, .md or .pdf) | 진단서 경로 (.html, .md, .pdf)
param    = issuer | | organisation printed on the report | 진단서에 들어갈 발행처
gui      = diff
run      = diff {ref} {cur} --report {report} [--issuer {issuer}]
tip      = Exit code: 0 OK · 1 DRIFT · 2 BLIND (cannot judge)
tip.ko   = 종료 코드: 0 OK · 1 DRIFT · 2 BLIND (판정 불가)
tip      = Set DDOC_LANG=ko (or add --lang ko) for a Korean report
tip.ko   = 한국어 진단서는 DDOC_LANG=ko (또는 --lang ko)

[suspect-ok]
group    = Compare two datasets
group.ko = 두 데이터 비교
title    = OK, but something looks off
title.ko = OK 인데 의심스러울 때
when     = The verdict is OK yet you expect a change — e.g. a column with few distinct values
when.ko  = 판정은 OK 인데 변화가 있을 것 같을 때 — 예: 값 종류가 적은 열
param    = ref | | baseline | 기준 데이터
param    = cur | | current | 현재 데이터
param    = attr_threshold | 0.15 | single-attribute threshold (default 0.25) | 단일 속성 기준 (기본 0.25)
param    = report | note.html | report path | 진단서 경로
gui      = diff
run      = diff {ref} {cur} --attr-threshold {attr_threshold} --report {report}
tip      = Look for "Hidden change" and "near" patterns in the pattern reading
tip.ko   = 유형 판독의 "잠복 변화형" 과 "가까움" 목록을 보세요
tip      = A lower threshold flags more; keep the default in CI unless you have measured it
tip.ko   = 기준을 낮추면 더 많이 잡힙니다. 측정하기 전에는 CI 에서는 기본값을 쓰세요

[compare-images]
group    = Compare two datasets
group.ko = 두 데이터 비교
title    = Images or texts, with an embedding map
title.ko = 이미지·텍스트를 임베딩 지도와 함께
when     = Image or text folders where the content itself may have changed
when.ko  = 이미지·텍스트 폴더에서 내용 자체가 바뀌었을 수 있을 때
param    = ref | | baseline folder | 기준 폴더
param    = cur | | current folder | 현재 폴더
param    = report | note.html | report path | 진단서 경로
gui      = diff
run      = diff {ref} {cur} --with-embeddings --report {report}
tip      = Needs the vision or text plugin with torch and CLIP; check with `ddoc doctor`
tip.ko   = torch·CLIP 과 vision 또는 text 플러그인이 필요합니다 (`ddoc doctor` 로 확인)
tip      = Mixing near 0 on the map means the two sets separate: look at items near each centre
tip.ko   = 지도의 이웃 섞임이 0 에 가까우면 두 데이터가 갈라진 것입니다 — 각 중심 근처 항목을 보세요

[with-samples]
group    = Compare two datasets
group.ko = 두 데이터 비교
title    = Report with the first rows of each side
title.ko = 앞 몇 행을 넣은 진단서
when     = Readers need to see what the rows look like (stays on your machine)
when.ko  = 읽는 사람이 실제 행 모양을 봐야 할 때 (공유 범위 주의)
param    = ref | | baseline CSV | 기준 CSV
param    = cur | | current CSV | 현재 CSV
param    = sample_rows | 3 | rows per side (up to 20) | 쪽마다 행 수 (최대 20)
param    = report | note.html | report path | 진단서 경로
gui      = diff
run      = diff {ref} {cur} --sample-rows {sample_rows} --report {report}
tip      = The rows are raw data — the report says so; mind who you send it to
tip.ko   = 들어가는 행은 원본 데이터입니다 — 보낼 대상을 확인하세요

# ── One dataset ─────────────────────────────────────────────────────────────

[profile]
group    = One dataset
group.ko = 데이터 하나
title    = Profile a dataset
title.ko = 데이터 하나 살펴보기
when     = Size, period, columns and quality findings of one CSV, before comparing anything
when.ko  = 비교 전에 CSV 하나의 규모·기간·열·품질 소견 보기
param    = data_path | | CSV file or folder | CSV 파일 또는 폴더
param    = report | profile.html | report path (.html, .md or .pdf) | 보고서 경로 (.html, .md, .pdf)
gui      = eda
run      = analyze eda --data-path {data_path} --report {report} --quiet
tip      = Identifier-like and date columns are worth excluding from drift checks
tip.ko   = 식별자형 열과 날짜 열은 드리프트 비교에서 빼는 편이 좋습니다

# ── Share and automate ──────────────────────────────────────────────────────

[pr-comment]
group    = Share and automate
group.ko = 공유와 자동화
title    = Markdown for a pull request or ticket
title.ko = PR·이슈에 붙일 Markdown
when     = Paste the verdict, reading and checklist into a pull request, ticket or chat
when.ko  = 판정·판독·점검 체크리스트를 PR·이슈·채팅에 붙일 때
param    = ref | | baseline | 기준 데이터
param    = cur | | current | 현재 데이터
param    = out | drift.md | Markdown path | Markdown 경로
run      = diff {ref} {cur} --report {out}
tip      = The first actions come as checkboxes (- [ ])
tip.ko   = 먼저 할 일이 체크박스(- [ ])로 들어갑니다

[ci-gate]
group    = Share and automate
group.ko = 공유와 자동화
title    = A data gate in CI
title.ko = CI 데이터 게이트
when     = Fail a pipeline when incoming data drifted
when.ko  = 들어온 데이터가 드리프트면 파이프라인을 멈출 때
tip      = The exit code is the verdict: 0 OK, 1 DRIFT, 2 BLIND — `ddoc diff ref cur` is the whole gate
tip.ko   = 종료 코드가 곧 판정입니다: 0 OK, 1 DRIFT, 2 BLIND — `ddoc diff ref cur` 하나가 게이트
tip      = GitHub Actions: uses: keti-datadrift/datadrift_base_framework@main (see examples/ci-gate)
tip.ko   = GitHub Actions: uses: keti-datadrift/datadrift_base_framework@main (examples/ci-gate 참고)

[render-again]
group    = Share and automate
group.ko = 공유와 자동화
title    = Render a saved result again
title.ko = 저장한 결과로 보고서 다시 만들기
when     = You kept the JSON (diff --json, analyze --json) and want HTML, PDF or Markdown
when.ko  = JSON 결과(diff --json, analyze --json)를 HTML·PDF·Markdown 으로 다시 만들 때
param    = input | | result JSON | 결과 JSON
param    = out | report.html | output (.html, .pdf or .md) | 출력 (.html, .pdf, .md)
gui      = report
run      = report render -i {input} -o {out}
tip      = A drift envelope is judged with the same thresholds as diff (--threshold, --attr-threshold)
tip.ko   = drift envelope 은 diff 와 같은 기준으로 판정됩니다 (--threshold, --attr-threshold)

[serve]
group    = Share and automate
group.ko = 공유와 자동화
title    = Browser GUI and REST API
title.ko = 브라우저 GUI 와 REST API
when     = Let others run diagnoses from a browser, or call ddoc from another service
when.ko  = 브라우저에서 진단하거나 다른 서비스에서 ddoc 을 부를 때
param    = port | 8765 | port | 포트
run      = serve --port {port}
tip      = Open http://127.0.0.1:{port} — the Diagnose tab shows the report inline
tip.ko   = http://127.0.0.1:{port} 를 여세요 — 진단 탭에서 진단서를 바로 봅니다
tip      = Set DDOC_API_KEY before binding to anything but localhost
tip.ko   = localhost 밖으로 열 때는 DDOC_API_KEY 를 먼저 설정하세요
